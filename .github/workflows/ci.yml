name: ci

# runs on every push and pull request.
# it builds, runs spotbugs, runs the testcontainers tests and makes a coverage report.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # docker is already on the github runner, so testcontainers can start
      # postgres and redis on its own. no service block needed.
      - name: build and test
        run: ./mvnw -B verify

      # report only, does not fail the build 
      - name: static analysis (spotbugs)
        run: ./mvnw -B spotbugs:spotbugs

      - name: upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
  
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t mahnflow:ci .

      - name: scan image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mahnflow:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
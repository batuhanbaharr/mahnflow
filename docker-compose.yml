# one command brings up everything: db, cache, the app, and monitoring.
#   docker-compose up
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mahnflow
      POSTGRES_USER: mahnflow
      POSTGRES_PASSWORD: mahnflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahnflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mahnflow
      DB_USER: mahnflow
      DB_PASSWORD: mahnflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-please-change-this-to-a-long-random-value-32b
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
